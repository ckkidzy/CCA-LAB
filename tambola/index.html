<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBSTI Tambola 2026</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="firebase.js"></script>
    <script type="module" src="app.js"></script>
</head>

<body>

<header>

<h1>🍀 DBSTI TAMBOLA 2026</h1>

<p>Choose Your Lucky Ticket</p>

</header>

<section class="stats">

<div class="card">
<h2 id="available">0</h2>
<p>Available</p>
</div>

<div class="card">
<h2 id="reserved">0</h2>
<p>Reserved</p>
</div>

<div class="card">
<h2 id="sold">0</h2>
<p>Sold</p>
</div>

</section>

<section class="search">

<input
type="text"
id="search"
placeholder="Search Ticket Number">

</section>

<section id="tickets" class="tickets">

<!-- Tickets appear here -->

</section>

</body>
</html>
