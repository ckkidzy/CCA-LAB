<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DBSTI Tambola 2026</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- Animated Background -->

<div class="background">
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
<div class="circle c4"></div>
</div>

<!-- Hero -->

<header>

<div class="logo">

🍀 🎰 🎲

</div>

<h1>

DBSTI TAMBOLA 2026

</h1>

<p>

Choose Your Lucky Ticket

</p>

<div class="hero-buttons">

<div class="price">

🎟 Ticket Price ₹10

</div>

<div class="luck">

🍀 Good Luck!

</div>

</div>

</header>

<!-- Statistics -->

<section class="stats">

<div class="stat-card available-card">

<div class="emoji">

🟢

</div>

<h2 id="availableCount">

180

</h2>

<span>

Available

</span>

</div>

<div class="stat-card reserved-card">

<div class="emoji">

🟠

</div>

<h2 id="reservedCount">

0

</h2>

<span>

Reserved

</span>

</div>

<div class="stat-card sold-card">

<div class="emoji">

🔴

</div>

<h2 id="soldCount">

0

</h2>

<span>

Sold

</span>

</div>

</section>

<!-- Search -->

<section class="search-area">

<input

type="text"

id="search"

placeholder="🔍 Search Ticket Number (109 - 258)"

>

</section>

<!-- Legend -->

<section class="legend">

<div>

<span class="green-dot"></span>

Available

</div>

<div>

<span class="orange-dot"></span>

Reserved

</div>

<div>

<span class="red-dot"></span>

Sold

</div>

</section>

<!-- Ticket Grid -->

<section

class="ticket-grid"

id="ticketGrid"

>

<!-- JavaScript will automatically generate 150 tickets here -->

</section>

<!-- Popup -->

<div

class="modal"

id="ticketModal"

>

<div class="modal-box">

<button

class="close"

id="closeModal"

>

×

</button>

<h2 id="modalTitle">

Ticket 001

</h2>

<img

id="modalImage"

src=""

alt="Ticket"

>

<div

class="modal-status"

id="modalStatus"

>

🟢 Available

</div>

<button

id="reserveBtn"

>

Reserve via WhatsApp

</button>

</div>

</div>

<footer>

🍀

May the Luckiest Player Win!

<br>

DBSTI Tambola 2026

</footer>

<script type="module" src="app.js"></script>
</body>

</html>
