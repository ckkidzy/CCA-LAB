<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Winner Admin</title>

<link rel="stylesheet" href="style.css">

<style>

body{

background:#eef2f7;

font-family:Segoe UI,sans-serif;

}

.container{

width:94%;

max-width:1300px;

margin:auto;

padding:30px 0;

}

h1{

text-align:center;

margin-bottom:30px;

}

#winnerGrid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:20px;

}

.winnerCard{

background:white;

border-radius:20px;

padding:22px;

box-shadow:0 8px 25px rgba(0,0,0,.08);

color:#181fed;

}

.winnerCard h2{

margin-bottom:15px;

font-size:24px;

color:#222;

font-weight:700;

}
.winnerCard input{

width:100%;

padding:12px;

font-size:16px;

border-radius:10px;

border:1px solid #ddd;

margin-bottom:12px;

}

.verifyBtn{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.verifyBtn:hover{

background:#1747b8;

}

</style>

</head>

<body>

<div class="container">

<h1>🏆 Winner Verification</h1>

<div id="winnerGrid"></div>

</div>

<script type="module"
src="winner-admin.js"></script>

</body>

</html>
