<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Winner Admin</title>

<link rel="stylesheet" href="style.css">

<style>

body{

background:#eef2f7;

font-family:Segoe UI,sans-serif;

}

.container{

width:94%;

max-width:1300px;

margin:auto;

padding:30px 0;

}

h1{

text-align:center;

margin-bottom:30px;

}

#winnerGrid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:20px;

}

.winnerCard{

background:white;

border-radius:20px;

padding:22px;

box-shadow:0 8px 25px rgba(0,0,0,.08);

color:#222;
}

.winnerCard h2{

margin-bottom:15px;

font-size:24px;

color:#222;

font-weight:700;

}
.winnerCard input{

width:100%;

padding:12px;

font-size:16px;

border-radius:10px;

border:1px solid #ddd;

margin-bottom:12px;

}

.verifyBtn{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.verifyBtn:hover{

background:#1747b8;

}

.pageTitle{

text-align:center;

margin-bottom:30px;

font-size:42px;

font-weight:800;

color:#1f2937;

}
.verifyModal{

position:fixed;

inset:0;

background:rgba(0,0,0,.55);

display:none;

align-items:center;

justify-content:center;

z-index:999;

}

.verifyModal.show{

display:flex;

}

.verifyBox{

background:white;

padding:30px;

border-radius:20px;

width:350px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.25);

}

.verifyBox h2{

color:#111;

margin-bottom:18px;

}

.verifyBox p{

font-size:18px;

margin:10px 0;

color:#333;

}

.verifyButtons{

display:flex;

gap:12px;

margin-top:20px;

}

.verifyButtons button{

flex:1;

padding:12px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

font-size:16px;

}

#confirmWinner{

background:#16a34a;

color:white;

}

#cancelWinner{

background:#e5e7eb;

}
</style>

</head>

<body>

<div class="container">

<h1 class="pageTitle">🏆 Winner Verification</h1>

<div id="winnerGrid"></div>

</div>
<div id="verifyModal" class="verifyModal">

<div class="verifyBox">

<h2 id="verifyPrize"></h2>

<p id="verifyName"></p>

<p id="verifyTicket"></p>

<div class="verifyButtons">

<button id="confirmWinner">

✅ Confirm Winner

</button>

<button id="cancelWinner">

Cancel

</button>

</div>

</div>

</div>
<script type="module"
src="winner-admin.js"></script>

</body>

</html>
