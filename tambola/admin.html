<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DBSTI Tambola Admin</title>

<link rel="stylesheet" href="style.css">

<style>

body{

background:#f5f7fb;

font-family:Arial,sans-serif;

}

.adminHeader{

background:#1f2937;

color:white;

padding:20px;

text-align:center;

}

.adminHeader h1{

margin:0;

font-size:32px;

}

.topBar{

width:95%;

max-width:1200px;

margin:25px auto;

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

flex-wrap:wrap;

}

#search{

padding:12px 18px;

border-radius:30px;

border:none;

width:280px;

font-size:16px;

}

.ticketGrid{

width:95%;

max-width:1200px;

margin:auto;

display:grid;

grid-template-columns:repeat(auto-fill,minmax(70px,1fr));

gap:12px;

padding-bottom:50px;

}

.adminTicket{

height:70px;

border-radius:15px;

display:flex;

justify-content:center;

align-items:center;

font-weight:bold;

cursor:pointer;

color:white;

transition:.25s;

}

.adminTicket:hover{

transform:scale(1.08);

}

.available{

background:#22c55e;

}

.reserved{

background:#f59e0b;

}

.sold{

background:#ef4444;

}

/* =======================
STATUS POPUP
======================= */

.statusModal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.55);

display:none;

justify-content:center;

align-items:center;

z-index:999;

}

.statusModal.show{

display:flex;

}

.statusBox{

background:white;

padding:30px;

border-radius:20px;

width:320px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.25);

animation:popup .25s ease;

}

@keyframes popup{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

.statusBtn{

width:100%;

padding:15px;

margin:10px 0;

font-size:18px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:bold;

transition:.25s;

}

.statusBtn:hover{

transform:scale(1.03);

}

.availableBtn{

background:#22c55e;

color:white;

}

.reservedBtn{

background:#f59e0b;

color:white;

}

.soldBtn{

background:#ef4444;

color:white;

}

.closeStatus{

width:100%;

padding:14px;

margin-top:15px;

background:#ddd;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

}

.counterBox{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.counter{

padding:10px 15px;

border-radius:12px;

font-weight:bold;

font-size:14px;

}

.availableCounter{

background:#dcfce7;

color:#166534;

}

.reservedCounter{

background:#fef3c7;

color:#92400e;

}

.soldCounter{

background:#fee2e2;

color:#991b1b;

}

</style>

</head>

<body>

<div class="adminHeader">

<h1>🎟 DBSTI Tambola Admin</h1>

</div>

<div class="topBar">

<input
id="search"
placeholder="Search Ticket">

<div class="counterBox">

<div class="counter availableCounter">
🟢 Available:
<span id="availableCount">0</span>
</div>

<div class="counter reservedCounter">
🟠 Reserved:
<span id="reservedCount">0</span>
</div>

<div class="counter soldCounter">
🔴 Sold:
<span id="soldCount">0</span>
</div>

</div>

</div>

<script type="module" src="admin.js"></script>

<!-- STATUS MODAL -->

<div id="statusModal" class="statusModal">

<div class="statusBox">

<h2 id="ticketTitle">Ticket</h2>

<button class="statusBtn availableBtn" id="availableBtn">
🟢 Available
</button>

<button class="statusBtn reservedBtn" id="reservedBtn">
🟠 Reserved
</button>

<button class="statusBtn soldBtn" id="soldBtn">
🔴 Sold
</button>

<button class="closeStatus" id="closeStatus">
Cancel
</button>

</div>

</div>

</body>

</html>
