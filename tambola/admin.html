<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DBSTI Tambola Admin</title>

<link rel="stylesheet" href="style.css">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,Helvetica,sans-serif;

}

body{

background:#f4f6fb;

}

header{

background:#1e293b;

color:white;

padding:20px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.15);

}

header h1{

font-size:32px;

margin-bottom:6px;

}

header p{

opacity:.85;

font-size:15px;

}

.wrapper{

width:95%;

max-width:1400px;

margin:25px auto;

}

/* ---------- DASHBOARD ---------- */

.dashboard{

display:flex;

gap:18px;

margin-bottom:25px;

flex-wrap:wrap;

justify-content:center;

}

.stat{

flex:1;

min-width:180px;

background:white;

border-radius:22px;

padding:18px;

text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,.08);

transition:.3s;

}

.stat:hover{

transform:translateY(-5px);

}

.emoji{

font-size:30px;

margin-bottom:8px;

}

.stat h2{

font-size:38px;

font-weight:800;

margin-bottom:5px;

color:#222;

}

.stat p{

font-size:15px;

font-weight:700;

color:#666;

}

.availableCard{

border-top:6px solid #22c55e;

}

.reservedCard{

border-top:6px solid #f59e0b;

}

.soldCard{

border-top:6px solid #ef4444;

}

/* ---------- SEARCH ---------- */

.searchArea{

display:flex;

justify-content:center;

margin-bottom:20px;

}

#search{

width:350px;

max-width:95%;

padding:14px 20px;

border-radius:30px;

border:2px solid #ddd;

font-size:16px;

outline:none;

}

/* ---------- FILTER ---------- */

.filters{

display:flex;

justify-content:center;

gap:10px;

margin-bottom:25px;

flex-wrap:wrap;

}

.filterBtn{

padding:10px 18px;

border:none;

border-radius:30px;

cursor:pointer;

font-weight:bold;

background:#e5e7eb;

transition:.25s;

}

.filterBtn:hover{

transform:translateY(-2px);

}

.filterBtn.active{

background:#2563eb;

color:white;

}

/* ---------- GRID ---------- */

.ticketGrid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(70px,1fr));

gap:12px;

}

.adminTicket{

height:70px;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

font-size:18px;

cursor:pointer;

color:white;

transition:.25s;

box-shadow:0 6px 15px rgba(0,0,0,.15);

}

.adminTicket:hover{

transform:scale(1.08);

}

/* ---------- POPUP ---------- */

.statusModal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

display:none;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.55);

z-index:999;

}

.statusModal.show{

display:flex;

}

.statusBox{

background:white;

padding:30px;

width:320px;

border-radius:20px;

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,.25);

animation:pop .25s ease;

}

@keyframes pop{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

.statusBox h2{

margin-bottom:20px;

}

.statusBtn{

width:100%;

padding:14px;

margin:8px 0;

border:none;

border-radius:12px;

cursor:pointer;

font-size:17px;

font-weight:bold;

color:white;

}

.availableBtn{

background:#16a34a;

}

.reservedBtn{

background:#f59e0b;

}

.soldBtn{

background:#ef4444;

}

.closeBtn{

margin-top:10px;

width:100%;

padding:12px;

border:none;

background:#ddd;

border-radius:12px;

cursor:pointer;

font-size:16px;

}

</style>

</head>

<body>

<header>

<h1>🎟 DBSTI Tambola Admin</h1>

<p>Realtime Ticket Control Panel</p>

</header>

<div class="wrapper">

<div class="dashboard">

<div class="stat availableCard">

<div class="emoji">🟢</div>

<h2 id="availableCount">143</h2>

<p>Available</p>

</div>

<div class="stat reservedCard">

<div class="emoji">🟠</div>

<h2 id="reservedCount">3</h2>

<p>Reserved</p>

</div>

<div class="stat soldCard">

<div class="emoji">🔴</div>

<h2 id="soldCount">4</h2>

<p>Sold</p>

</div>

</div>
<div class="searchArea">

<input
type="text"
id="search"
placeholder="Search Ticket Number">

</div>

<div class="filters">

<button class="filterBtn active" data-filter="all">All</button>

<button class="filterBtn" data-filter="available">Available</button>

<button class="filterBtn" data-filter="reserved">Reserved</button>

<button class="filterBtn" data-filter="sold">Sold</button>

</div>

<div
class="ticketGrid"
id="ticketGrid">

</div>

</div>

<div
class="statusModal"
id="statusModal">

<div class="statusBox">

<h2 id="ticketTitle">

Ticket

</h2>

<button
class="statusBtn availableBtn"
id="availableBtn">

🟢 Available

</button>

<button
class="statusBtn reservedBtn"
id="reservedBtn">

🟠 Reserved

</button>

<button
class="statusBtn soldBtn"
id="soldBtn">

🔴 Sold

</button>

<button
class="closeBtn"
id="closeStatus">

Cancel

</button>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
