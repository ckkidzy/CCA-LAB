<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DBSTI Tambola Admin</title>

<link rel="stylesheet" href="style.css">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,Helvetica,sans-serif;

}

body{

background:#f4f6fb;

}

header{

background:#1e293b;

color:white;

padding:20px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.15);

}

header h1{

font-size:32px;

margin-bottom:6px;

}

header p{

opacity:.85;

font-size:15px;

}

.wrapper{

width:95%;

max-width:1400px;

margin:25px auto;

}

/* ---------- DASHBOARD ---------- */

/* ================= DASHBOARD ================= */

.dashboard{

display:flex;

justify-content:center;

gap:10px;

margin:15px auto 18px;

flex-wrap:wrap;

}

.stat{

width:110px;

height:68px;

background:#fff;

border-radius:14px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

transition:.25s;

cursor:default;

}

.stat:hover{

transform:translateY(-3px);

box-shadow:0 10px 22px rgba(0,0,0,.12);

}

.emoji{

font-size:15px;

margin-bottom:2px;

}

.stat h2{

font-size:22px;

font-weight:800;

line-height:1;

margin:1px 0;

color:#222;

}

.stat p{

font-size:11px;

font-weight:600;

color:#777;

margin-top:2px;

}

.availableCard{

border-top:3px solid #22c55e;

}

.reservedCard{

border-top:3px solid #f59e0b;

}

.soldCard{

border-top:3px solid #ef4444;

}
/* ---------- SEARCH ---------- */

.searchArea{

display:flex;

justify-content:center;

margin-bottom:20px;

}

#search{

width:350px;

max-width:95%;

padding:14px 20px;

border-radius:30px;

border:2px solid #ddd;

font-size:16px;

outline:none;

}

/* ---------- FILTER ---------- */

.filters{

display:flex;

justify-content:center;

gap:10px;

margin-bottom:25px;

flex-wrap:wrap;

}

.filterBtn{

padding:10px 18px;

border:none;

border-radius:30px;

cursor:pointer;

font-weight:bold;

background:#e5e7eb;

transition:.25s;

}

.filterBtn:hover{

transform:translateY(-2px);

}

.filterBtn.active{

background:#2563eb;

color:white;

}

/* ---------- GRID ---------- */

.ticketGrid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(70px,1fr));

gap:12px;

}

.adminTicket{

height:70px;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

font-size:18px;

cursor:pointer;

color:white;

transition:.25s;

box-shadow:0 6px 15px rgba(0,0,0,.15);

}

.adminTicket:hover{

transform:scale(1.08);

}

/* ---------- POPUP ---------- */

.statusModal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

display:none;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.55);

z-index:999;

}

.statusModal.show{

display:flex;

}

.statusBox{

background:white;

padding:30px;

width:320px;

border-radius:20px;

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,.25);

animation:pop .25s ease;

}

@keyframes pop{

from{

transform:scale(.8);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

.statusBox h2{

margin-bottom:20px;

}

.statusBtn{

width:100%;

padding:14px;

margin:8px 0;

border:none;

border-radius:12px;

cursor:pointer;

font-size:17px;

font-weight:bold;

color:white;

}

.availableBtn{

background:#16a34a;

}

.reservedBtn{

background:#f59e0b;

}

.soldBtn{

background:#ef4444;

}

.closeBtn{

margin-top:10px;

width:100%;

padding:12px;

border:none;

background:#ddd;

border-radius:12px;

cursor:pointer;

font-size:16px;

}

.statusBox input{

width:100%;

padding:12px;

margin-bottom:10px;

border-radius:10px;

border:1px solid #ddd;

font-size:15px;

outline:none;

transition:.25s;

}

.statusBox input:focus{

border-color:#2563eb;

box-shadow:0 0 8px rgba(37,99,235,.25);

}
</style>

</head>

<body>

<header>

<h1>🎟 DBSTI Tambola Admin</h1>

<p>Realtime Ticket Control Panel</p>

</header>

<div class="wrapper">

<div class="dashboard">

<div class="stat availableCard">

<div class="emoji">🟢</div>

<h2 id="availableCount">0</h2>

<p>Available</p>

</div>

<div class="stat reservedCard">

<div class="emoji">🟠</div>

<h2 id="reservedCount">0</h2>

<p>Reserved</p>

</div>

<div class="stat soldCard">

<div class="emoji">🔴</div>

<h2 id="soldCount">0</h2>

<p>Sold</p>

</div>

</div>
<div class="searchArea">

<input
type="text"
id="search"
placeholder="Search Ticket Number">

</div>

<div class="filters">

<button class="filterBtn active" data-filter="all">All</button>

<button class="filterBtn" data-filter="available">Available</button>

<button class="filterBtn" data-filter="reserved">Reserved</button>

<button class="filterBtn" data-filter="sold">Sold</button>

</div>

<div
class="ticketGrid"
id="ticketGrid">

</div>

</div>

<div
class="statusModal"
id="statusModal">

<div class="statusBox">

<h2 id="ticketTitle">

Ticket

</h2>

<input
type="text"
id="buyerName"
placeholder="Customer Name">

<input
type="text"
id="buyerPhone"
placeholder="Phone Number">

<button
class="statusBtn availableBtn"
id="availableBtn">

🟢 Available

</button>

<button
class="statusBtn reservedBtn"
id="reservedBtn">

🟠 Reserved

</button>

<button
class="statusBtn soldBtn"
id="soldBtn">

🔴 Sold

</button>

<button
class="closeBtn"
id="closeStatus">

Cancel

</button>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
